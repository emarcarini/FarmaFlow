services:
  # 1. Aplicação FarmaFlow (Painel Web, API, Webhook e Queue Workers)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - 80
    environment:
      - APP_NAME="FarmaFlow"
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY:-}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-farmaflow}
      - DB_USERNAME=${DB_USERNAME:-farmaflow_user}
      - DB_PASSWORD=${DB_PASSWORD:-farmaflow_pass_secret123}
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-farmaflow_evolution_key_123}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-comercial}
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.farmaflow-app.rule=Host(`farmaflow.npper.com`)"
      - "traefik.http.services.farmaflow-app.loadbalancer.server.port=80"

  # 2. Banco de Dados PostgreSQL 15 (FarmaFlow App + Evolution API)
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-farmaflow}
      POSTGRES_USER: ${DB_USERNAME:-farmaflow_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-farmaflow_pass_secret123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-farmaflow_user} -d ${DB_DATABASE:-farmaflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  # 3. Redis para Filas, Cache e Sessões
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    expose:
      - 6379
    networks:
      - default

  # 4. Evolution API v2 (WhatsApp Engine)
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.1
    restart: unless-stopped
    expose:
      - 8080
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=${EVOLUTION_PUBLIC_URL:-https://evolution.npper.com}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-farmaflow_evolution_key_123}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${DB_USERNAME:-farmaflow_user}:${DB_PASSWORD:-farmaflow_pass_secret123}@postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_v2
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_MESSAGES=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_PROFILES=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379
      - WEBHOOK_GLOBAL_ENABLED=false
      - CONFIG_SESSION_PHONE_CLIENT=FarmaFlow
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK
      - LOG_COLOR=true
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.farmaflow-evo.rule=Host(`evolution.npper.com`)"
      - "traefik.http.services.farmaflow-evo.loadbalancer.server.port=8080"

volumes:
  storage_data:
  redis_data:
  postgres_data:
  evolution_instances:

networks:
  dokploy-network:
    external: true
